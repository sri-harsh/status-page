<!DOCTYPE html>
<!-- tally v2.1 -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Tally</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Tally" />
<meta name="theme-color" content="#E11D48" />
<meta name="color-scheme" content="only light" />
<link rel="manifest" href='data:application/manifest+json,{"name":"Tally","short_name":"Tally","start_url":".","display":"standalone","background_color":"%23F5F5F4","theme_color":"%23E11D48"}' />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F5F5F4;--bg-warm:#FAFAF9;--surface:#FFFFFF;--surface-2:#F5F5F4;
    --ink:#0C0A09;--ink-soft:#57534E;--ink-faint:#A8A29E;
    --line:#E7E5E4;--line-strong:#D6D3D1;
    --accent:#E11D48;--accent-soft:#FFE4E6;--accent-ink:#BE123C;
    --green:#16A34A;--green-soft:#DCFCE7;--over:#DC2626;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.06);
    --radius:14px;--radius-sm:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{color-scheme:light;}
  html[data-dark="1"]{color-scheme:dark;}
  html[data-dark="1"] .sketchbg svg{stroke:#44403C;opacity:.25;}
  html[data-dark="1"] nav{background:rgba(28,25,23,.85);}
  html[data-dark="1"] .scrim{background:rgba(0,0,0,.6);}
  html[data-dark="1"] .ring svg circle:first-of-type{stroke:#292524;}
  html[data-dark="1"] .wglass{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));}
  html[data-dark="1"]{
    --bg:#171412;--bg-warm:#221F1D;--surface:#2A2623;--surface-2:#342F2C;
    --ink:#F5F3F0;--ink-soft:#C8C0BB;--ink-faint:#7A736E;
    --line:#342F2C;--line-strong:#4A4340;
    --green:#4ADE80;--green-soft:#14331F;--over:#FC8181;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 3px 12px rgba(0,0,0,.45);
  }
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:"Inter",-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  /* floating sketch icons */
  .sketchbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .sketchbg svg{position:absolute;stroke:#A8A29E;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.18;}
  .app{position:relative;z-index:1;}
  .app{max-width:560px;margin:0 auto;padding:0 16px 120px;min-height:100vh;}
  header{padding:24px 2px 8px;}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:18px;}
  .mark{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--accent);position:relative;flex:none;}
  .mark::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent);transform:scale(0);animation:pop .6s .2s cubic-bezier(.2,1.4,.4,1) forwards;}
  @keyframes pop{to{transform:scale(1);}}
  .brand h1{font-family:"Inter",-apple-system,sans-serif;font-weight:600;font-size:20px;letter-spacing:-.01em;margin:0;}
  .brand .sub{font-size:11px;color:var(--ink-faint);margin-left:auto;letter-spacing:.04em;text-transform:uppercase;font-weight:600;}
  .datebar{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .ring{width:48px;height:48px;flex:none;position:relative;}
  .ring svg{transform:rotate(-90deg);}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;color:var(--ink);}
  .dnav{flex:1;min-width:0;cursor:pointer;-webkit-user-select:none;user-select:none;}
  .dnav .dow{font-family:"Inter",-apple-system,sans-serif;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1;transition:color .15s;}
  .dnav .fdate{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .dnav.away .dow{color:var(--accent);}
  .dnav.away .fdate::after{content:" \2190  tap for today";font-size:10px;color:var(--accent);font-weight:600;}
  .arrows{display:flex;gap:5px;flex-shrink:0;}
  .arrows button{flex:none;width:34px;height:34px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;font-size:16px;color:var(--ink);font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s;}
  .arrows button:active{transform:scale(.92);}
  main{animation:rise .5s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .section{margin-top:22px;}
  .section>.shead{display:flex;align-items:baseline;gap:8px;margin:0 4px 11px;}
  .section .shead h2{font-family:"Inter",-apple-system,sans-serif;font-weight:600;font-size:15px;margin:0;}
  .section .shead .meta{font-size:11px;color:var(--ink-faint);font-family:"JetBrains Mono",monospace;margin-left:auto;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .metric{padding:15px 16px;}
  .metric .top{display:flex;align-items:center;gap:11px;}
  .metric .ic{font-size:19px;width:26px;text-align:center;flex:none;}
  .metric .nm{font-weight:600;font-size:15px;}
  .metric .goalnote{font-size:11px;color:var(--ink-faint);margin-top:1px;font-family:"JetBrains Mono",monospace;}
  .metric .val{margin-left:auto;text-align:right;font-family:"JetBrains Mono",monospace;}
  .metric .val .n{font-size:22px;font-weight:700;line-height:1;}
  .metric .val .u{font-size:11px;color:var(--ink-faint);margin-left:3px;}
  .bar{height:6px;border-radius:99px;background:var(--surface-2);margin-top:13px;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:5px;background:var(--accent);width:0;transition:width .35s cubic-bezier(.3,1,.4,1);}
  .bar i.good{background:var(--green);}
  .bar i.over{background:var(--over);}
  /* slider */
  .sld{margin-top:15px;display:flex;align-items:center;gap:12px;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 2px 6px rgba(60,40,20,.3);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 2px 6px rgba(60,40,20,.3);cursor:pointer;}
  .sldends{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-faint);margin-top:4px;}
  .stepper{display:flex;gap:8px;margin-top:13px;align-items:center;}
  .stepper button{flex:none;width:40px;height:40px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface-2);font-size:20px;color:var(--ink);cursor:pointer;font-family:inherit;transition:transform .08s,background .12s;}
  .stepper button:active{transform:scale(.9);background:var(--accent-soft);}
  .stepper input{flex:1;min-width:0;height:40px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);text-align:center;font-family:"JetBrains Mono",monospace;font-size:17px;font-weight:600;color:var(--ink);}
  .stepper input:focus{outline:none;border-color:var(--accent);}
  .presets{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
  .presets button{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:600;font-family:"JetBrains Mono",monospace;color:var(--ink-soft);cursor:pointer;transition:transform .08s;}
  .presets button:active{transform:scale(.93);}
  .yest{margin-top:10px;}
  .yest button{border:1px dashed var(--line-strong);background:var(--surface-2);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;font-family:"JetBrains Mono",monospace;color:var(--accent-ink);cursor:pointer;}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:transform .08s,border-color .15s,background .15s;}
  .tile:active{transform:scale(.97);}
  .tile .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line-strong);flex:none;display:flex;align-items:center;justify-content:center;transition:all .18s;}
  .tile .box svg{width:14px;height:14px;stroke:#fff;stroke-width:3.5;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s;}
  .tile .lbl{font-size:13.5px;font-weight:600;line-height:1.15;}
  .tile .ic{font-size:15px;}
  .tile.on{background:var(--accent-soft);border-color:var(--accent);}
  .tile.on .box{background:var(--accent);border-color:var(--accent);}
  .tile.on .box svg{stroke-dashoffset:0;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;padding:14px;}
  .chip{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:transform .08s,background .14s,color .14s,border-color .14s;}
  .chip:active{transform:scale(.93);}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .chip.add{border-style:dashed;color:var(--accent-ink);background:transparent;}
  .foodlog{padding:14px 16px;}
  .recents{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-top:14px;margin-bottom:11px;-webkit-overflow-scrolling:touch;}
  .recents::-webkit-scrollbar{display:none;}
  .recents .rchip{flex:none;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .recents .rchip:active{transform:scale(.93);}
  .recents .rlbl{flex:none;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;align-self:center;padding-right:3px;}
  .foodrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);}
  .foodrow:last-child{border-bottom:none;}
  .foodrow{cursor:pointer;}
  .foodrow:active{background:var(--surface-2);}
  .fn-wrap{display:flex;align-items:baseline;gap:6px;flex:1;min-width:0;}
  .foodrow .fn{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .foodrow .fq{font-size:11px;color:var(--accent-ink);font-weight:700;font-family:"JetBrains Mono",monospace;flex:none;}
  .foodrow .fm{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-faint);flex:none;}
  .del-wrap{flex:none;padding:6px;margin:-6px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .foodrow .del{width:26px;height:26px;border-radius:8px;border:none;background:var(--surface-2);color:var(--over);font-size:16px;cursor:pointer;line-height:1;pointer-events:none;}
  .foodempty{color:var(--ink-faint);font-size:13px;text-align:center;padding:8px 0 4px;}
  .addfood{margin-top:11px;}
  .addfood .inp{display:flex;gap:8px;}
  .fsearch{position:relative;flex:1;}
  .fsearch input,.addfood input.macro{height:42px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);font-family:inherit;font-size:14px;color:var(--ink);padding:0 13px;width:100%;}
  .fsearch input:focus,.addfood input.macro:focus{outline:none;border-color:var(--accent);}
  .addbtn{flex:none;width:46px;height:42px;border-radius:11px;border:none;background:var(--accent);color:#fff;font-size:22px;cursor:pointer;transition:transform .08s;}
  .addbtn:active{transform:scale(.9);}
  .cambtn{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);font-size:18px;}
  .cambtn:active{background:var(--accent-soft);}
  .snaploading{position:relative;pointer-events:none;opacity:.7;}
  .snaploading::after{content:"";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .snapspinner{display:inline-block;width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
  .suggest{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;box-shadow:var(--shadow);z-index:30;max-height:210px;overflow:auto;}
  .suggest div{padding:10px 13px;font-size:13.5px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);}
  .suggest div:last-child{border-bottom:none;}
  .suggest div:active,.suggest div.hl{background:var(--accent-soft);}
  .suggest .sm{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-faint);flex:none;}
  .macros3{display:flex;gap:8px;margin-top:8px;}
  .macros3 input{flex:1;text-align:center;font-family:"JetBrains Mono",monospace;}
  .tots{display:flex;gap:8px;margin-top:13px;}
  .tot{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 8px;text-align:center;}
  .tot .tl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;}
  .tot .tv{font-family:"JetBrains Mono",monospace;font-size:17px;font-weight:700;margin-top:2px;}
  .tot .tv .g{color:var(--green);}
  .tot .tv .o{color:var(--over);}
  .minibar{height:4px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden;}
  .minibar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s;}
  .minibar i.good{background:var(--green);}
  .minibar i.over{background:var(--over);}
  .minibar i.pace{background:var(--line-strong);}
  .tot .tv .o{color:var(--over);}
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:50;}
  nav .inner{max-width:560px;margin:0 auto;display:flex;}
  nav button{flex:1;background:none;border:none;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink-faint);font-family:inherit;position:relative;}
  nav button .ni{font-size:20px;line-height:1;transition:transform .15s;}
  nav button .nt{font-size:10.5px;font-weight:700;letter-spacing:.02em;}
  nav button.on{color:var(--accent);}
  nav button.on .ni{transform:translateY(-1px) scale(1.05);}
  nav button.on::before{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:3px;background:var(--accent);}
  /* trends */
  .segtop{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:4px;}
  .segtop button{flex:1;height:38px;border:none;background:none;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .segtop button.on{background:var(--accent);color:#fff;}
  .monthnav{display:flex;align-items:center;gap:10px;margin:18px 4px 11px;}
  .monthnav .mt{font-family:"Inter",-apple-system,sans-serif;font-weight:600;font-size:18px;flex:1;}
  .monthnav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px;cursor:pointer;color:var(--ink);}
  .cal{padding:14px 14px 16px;}
  .calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px;}
  .calhead span{text-align:center;font-size:10px;font-weight:700;color:var(--ink-faint);}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .calcell{aspect-ratio:1;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-faint);}
  .calcell.empty{background:transparent;border:none;}
  .calcell .fillc{position:absolute;inset:0;border-radius:7px;background:var(--accent);}
  .calcell .dnum{position:relative;z-index:2;}
  .calcell[data-day]{cursor:pointer;transition:transform .08s;}
  .calcell[data-day]:active{transform:scale(.9);}
  .calcell.today{outline:2px solid var(--accent);outline-offset:1px;}
  .mstat{padding:13px 16px;display:flex;align-items:center;gap:12px;}
  .mstat .ic{font-size:18px;width:24px;text-align:center;}
  .mstat .ms-meta{flex:1;}
  .mstat .ms-meta .nm{font-weight:600;font-size:14px;}
  .mstat .ms-meta .sub{font-size:11px;color:var(--ink-faint);font-family:"JetBrains Mono",monospace;margin-top:2px;}
  .mstat .big{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700;}
  .goalcard{padding:14px 16px;}
  .goalrow{padding:12px 0;border-bottom:1px solid var(--line);}
  .goalrow:last-child{border-bottom:none;}
  .goalrow .gtop{display:flex;align-items:center;gap:10px;}
  .goalrow .gtop .ic{font-size:16px;width:22px;text-align:center;}
  .goalrow .gtop .nm{font-weight:600;font-size:14px;flex:1;}
  .goalrow .gtop .set{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--accent-ink);cursor:pointer;font-family:"JetBrains Mono",monospace;}
  .goalrow .gprog{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-soft);margin-top:8px;display:flex;justify-content:space-between;}
  .spark{padding:15px 16px;}
  .spark .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .spark .lab .t{font-weight:600;font-size:14px;}
  .spark .lab .v{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink-soft);}
  .spark svg{width:100%;height:54px;display:block;overflow:visible;}
  .streaks{padding:6px 4px;}
  .streakrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);}
  .streakrow:last-child{border-bottom:none;}
  .streakrow .ic{font-size:16px;width:22px;text-align:center;}
  .streakrow .nm{font-weight:600;font-size:14px;flex:1;}
  .streakrow .ct{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;}
  .streakrow .flame{font-size:13px;}
  .week{display:flex;gap:5px;padding:14px 16px;justify-content:space-between;}
  .week .d{flex:1;text-align:center;}
  .week .d .dl{font-size:10px;color:var(--ink-faint);font-weight:700;margin-bottom:6px;}
  .week .d .dot{width:100%;aspect-ratio:1;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);position:relative;}
  .week .d .dot i{position:absolute;inset:0;border-radius:8px;background:var(--accent);}
  .hrow{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);}
  .hrow:last-child{border-bottom:none;}
  .hrow .ic{font-size:17px;width:24px;text-align:center;}
  .hrow .meta{flex:1;min-width:0;}
  .hrow .meta .nm{font-weight:600;font-size:14px;}
  .hrow .meta .ty{font-size:11px;color:var(--ink-faint);font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.03em;}
  .hrow .ord{display:flex;flex-direction:column;gap:2px;}
  .hrow .ord button{width:26px;height:20px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-size:11px;cursor:pointer;color:var(--ink-soft);line-height:1;}
  .hrow .edit{width:32px;height:32px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:15px;}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:transform .08s;letter-spacing:.02em;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);}
  .btn.danger{background:none;color:var(--over);border:1px solid var(--line);}
  .btnrow{display:flex;gap:9px;margin-top:14px;}
  .btnrow .btn{margin:0;}
  .note{font-size:12px;color:var(--ink-faint);line-height:1.5;padding:0 4px;margin-top:10px;}
  .note b{color:var(--ink-soft);}
  .scrim{position:fixed;inset:0;background:rgba(35,29,23,.45);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-end;justify-content:center;}
  .scrim.open{display:flex;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:8px 18px max(22px,env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:slideup .28s cubic-bezier(.2,.9,.3,1);}
  @keyframes slideup{from{transform:translateY(100%);}to{transform:none;}}
  .grab{width:38px;height:4px;border-radius:3px;background:var(--line-strong);margin:6px auto 14px;}
  .sheet h3{font-family:"Inter",-apple-system,sans-serif;font-size:20px;font-weight:600;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.02em;}
  .field input,.field select,.field textarea{width:100%;height:46px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);font-family:inherit;font-size:15px;color:var(--ink);padding:0 13px;}
  .field textarea{height:auto;padding:11px 13px;min-height:74px;resize:vertical;line-height:1.5;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field .hint{font-size:11px;color:var(--ink-faint);margin-top:5px;line-height:1.4;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;height:42px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:200;pointer-events:none;box-shadow:var(--shadow);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .savedot{font-size:11px;color:var(--green);font-weight:700;opacity:0;transition:opacity .2s;letter-spacing:.03em;}
  .savedot.show{opacity:1;}
  .hide{display:none !important;}
  /* water card */
  .metric{position:relative;}
  .wglass{width:54px;height:76px;border:2.5px solid var(--line-strong);border-bottom-width:4px;border-radius:6px 6px 14px 14px;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(245,245,244,.4));flex:none;}
  .wfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#7DD3FC,#38BDF8 55%,#0EA5E9);transition:height .55s cubic-bezier(.3,1.1,.4,1);}
  .wfill::before{content:"";position:absolute;top:-4px;left:-10%;width:120%;height:8px;background:#7DD3FC;border-radius:50%;opacity:.9;animation:wavebob 2.8s ease-in-out infinite;}
  @keyframes wavebob{0%,100%{transform:translateX(0) scaleY(1);}50%{transform:translateX(6px) scaleY(.65);}}
  .wdrop{position:absolute;top:-12px;font-size:13px;animation:dropfall .45s cubic-bezier(.5,0,.8,.4) forwards;pointer-events:none;z-index:2;}
  @keyframes dropfall{from{transform:translateY(0);opacity:1;}to{transform:translateY(58px);opacity:0;}}
  .wrow{display:flex;gap:12px;align-items:stretch;margin-top:12px;}
  .vessels{display:flex;gap:8px;flex:1;}
  .vessel{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:9px 4px;text-align:center;cursor:pointer;font-family:inherit;transition:transform .12s,border-color .15s,background .15s;}
  .vessel:active{transform:scale(.92);border-color:var(--accent);background:var(--accent-soft);}
  .vessel .ve{font-size:21px;display:block;line-height:1.2;}
  .vessel .vn{font-size:11px;font-weight:600;color:var(--ink-soft);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vessel .vv{font-size:10px;font-family:"JetBrains Mono",monospace;color:var(--ink-faint);display:block;}
  .wfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .wfoot button{border:none;background:none;color:var(--ink-faint);font-size:11px;font-family:inherit;padding:4px 2px;cursor:pointer;text-decoration:underline;}

  /* banners */
  .banner{display:flex;align-items:center;gap:11px;width:100%;border:none;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);text-align:left;transition:transform .12s;}
  .banner:active{transform:scale(.985);}
  .banner .sub{display:block;font-size:11.5px;font-weight:500;opacity:.78;margin-top:2px;}
  .banner .arr{margin-left:auto;opacity:.85;font-size:18px;}
  .banner.dusk{background:linear-gradient(120deg,#1E1B4B,#4C1D95 60%,#6D28D9);}
  .banner.wrapb{background:linear-gradient(120deg,var(--accent-ink),var(--accent));}

  /* close-day sheet */
  .cdrow{display:flex;align-items:center;gap:10px;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;}
  .cdrow:last-of-type{border-bottom:none;}
  .cdrow .ic{font-size:17px;width:24px;text-align:center;flex:none;}
  .cdrow .nm{flex:1;font-size:14px;font-weight:600;}
  .cdrow .st{font-size:11.5px;color:var(--ink-faint);font-family:"JetBrains Mono",monospace;}
  .cdrow.done .nm{text-decoration:line-through;color:var(--ink-faint);}
  .cdrow .cdbox{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px;flex:none;transition:background .15s,border-color .15s,color .15s;}
  .cdrow.done .cdbox{background:var(--accent);border-color:var(--accent);color:#fff;}

  .setrow{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:14px;font-weight:600;color:var(--ink-soft);}
  .seg.sm{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none;}
  .seg.sm button{border:none;background:var(--surface);color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:600;padding:8px 14px;cursor:pointer;white-space:nowrap;}
  .seg.sm button.on{background:var(--accent);color:#fff;}
  .apprc{display:flex;flex-direction:column;gap:18px;}
  .approw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;flex-wrap:wrap;}
  .approw .aplbl{font-size:14px;font-weight:600;color:var(--ink);flex:none;}
  .approw .swatches{padding:0;margin:0;justify-content:flex-end;flex:1;gap:10px;}
  /* theme swatches */
  .swatches{display:flex;gap:10px;padding:0;flex-wrap:wrap;}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;outline:2px solid var(--line);outline-offset:2px;cursor:pointer;padding:0;transition:transform .12s;flex:none;}
  .swatch:active{transform:scale(.85);}
  .swatch.on{outline-color:var(--ink);outline-width:2.5px;}

  /* day swipe page turn */
  @keyframes pageL{from{opacity:.3;transform:translateX(26px);}to{opacity:1;transform:none;}}
  @keyframes pageR{from{opacity:.3;transform:translateX(-26px);}to{opacity:1;transform:none;}}
  .pageL{animation:pageL .22s ease-out;}
  .pageR{animation:pageR .22s ease-out;}

  /* sunday wrap */
  .wrapcard{background:linear-gradient(155deg,#1C1917 0%,#312E81 70%,#4C1D95 100%);border-radius:18px;padding:24px 18px 18px;color:#fff;margin-top:4px;}
  .wrapcard h4{margin:0 0 2px;font-size:21px;font-weight:800;letter-spacing:-.02em;}
  .wrapcard .wsub{font-size:11px;opacity:.6;margin-bottom:14px;font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;}
  .whero{text-align:center;padding:4px 0 18px;}
  .whero .ring2{font-size:42px;font-weight:800;font-family:"JetBrains Mono",monospace;letter-spacing:-.04em;}
  .whero .wlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin-top:2px;}
  .wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .wstat{background:rgba(255,255,255,.08);border-radius:12px;padding:12px;}
  .wstat .wbig{font-size:22px;font-weight:800;font-family:"JetBrains Mono",monospace;letter-spacing:-.03em;}
  .wstat .wbig span{font-size:12px;opacity:.6;font-weight:600;}
  .wstat .wlbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin-top:3px;}

  /* mentor read + scorecard */
  .mread{display:flex;flex-direction:column;gap:11px;}
  .mread .mline{font-size:13.5px;line-height:1.6;color:var(--ink-soft);}
  .sccards{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .sccards::-webkit-scrollbar{display:none;}
  .scchip{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:12px;font-weight:600;color:var(--ink-soft);font-family:inherit;cursor:pointer;transition:transform .12s;}
  .scchip:active{transform:scale(.94);}
  .scchip b{font-size:14px;font-weight:800;}
  .scchip.up b{color:var(--green);}
  .scchip.down b{color:var(--over);}
  .scchip.flat b{color:var(--ink-faint);}

  /* meal chips */
  .rchip.meal{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:700;}
  .rchip.msave{border-style:dashed;color:var(--ink-faint);}

  /* theme-aware svg accents */
  .spark svg path{stroke:var(--accent);}
  .spark svg circle{fill:var(--accent);}
  .ring svg circle:last-of-type{stroke:var(--accent);}

  /* delight */
  .piggy{display:inline-block;font-size:12px;margin-left:2px;animation:pigwag 2.6s ease-in-out infinite;transform-origin:50% 80%;}
  @keyframes pigwag{0%,100%{transform:rotate(0);}30%{transform:rotate(-9deg);}60%{transform:rotate(9deg);}}
  .pop-anim{animation:popin .35s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popin{0%{transform:scale(.92);}55%{transform:scale(1.07);}100%{transform:scale(1);}}
  .pop-anim .box svg{animation:drawcheck .3s .04s ease both;}
  @keyframes drawcheck{from{stroke-dashoffset:20;}to{stroke-dashoffset:0;}}
  .ring.full{animation:ringglow 2.2s ease-in-out infinite;}
  .ring.full svg circle:last-of-type{filter:drop-shadow(0 0 4px rgba(225,29,72,.5));}
  @keyframes ringglow{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  .confetti{position:fixed;z-index:300;pointer-events:none;width:9px;height:13px;border-radius:2px;opacity:0;animation:cpop 1.25s cubic-bezier(.22,.9,.32,1) forwards;}
  @keyframes cpop{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1);}18%{opacity:1;transform:translate(calc(var(--dx)*.45),var(--up)) rotate(calc(var(--rz)*.4));}100%{opacity:0;transform:translate(var(--dx),var(--dn)) rotate(var(--rz)) scale(.7);}}
  @media (prefers-reduced-motion:reduce){.confetti{display:none;}.piggy,.ring.full,.pop-anim,.pop-anim .box svg,.mark::after{animation:none !important;}}

  .syncstat{display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:13px;}
  .syncstat .sdot{width:8px;height:8px;border-radius:50%;flex:none;}
  .syncstat .sdot.on{background:var(--green);}
  .syncstat .sdot.off{background:var(--ink-faint);}
  .syncstat .stxt{flex:1;color:var(--ink-soft);}
  .syncstat .semail{font-weight:600;color:var(--ink);}

  /* streak badge on tiles */
  .tile .streak-ct{font-size:10px;font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--ink-faint);margin-left:auto;flex:none;display:flex;align-items:center;gap:2px;}
  .tile.on .streak-ct{color:var(--accent-ink);}
  .tile .streak-ct .flame{font-size:11px;}

  /* why subtitle on tile */
  .tile .tile-body{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
  .tile .why{font-size:10px;color:var(--ink-faint);font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile.on .why{color:var(--accent-ink);opacity:.7;}

  /* budget callout */
  .budget-row{display:flex;gap:8px;margin-top:10px;}
  .budget-chip{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:center;}
  .budget-chip .bl{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;}
  .budget-chip .bv{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:700;margin-top:2px;}
  .budget-chip .bv.good{color:var(--green);}
  .budget-chip .bv.warn{color:#D97706;}
  .budget-chip .bv.over{color:var(--over);}

  /* contextual nudge banners */
  .nudge{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);margin-bottom:10px;font-size:13px;line-height:1.4;}
  .nudge .ni2{font-size:18px;flex:none;}
  .nudge .nt2{flex:1;color:var(--ink-soft);}
  .nudge .nt2 b{color:var(--ink);font-weight:600;}
  .nudge .nd{font-size:18px;color:var(--ink-faint);flex:none;cursor:pointer;padding:2px 4px;}
  .nudge.warn{border-color:#FCD34D;background:#FFFBEB;}
  .nudge.slip{border-color:#FCA5A5;background:#FEF2F2;}
  html[data-dark="1"] .nudge.warn{background:#2D2500;border-color:#78500A;}
  html[data-dark="1"] .nudge.slip{background:#2D1515;border-color:#7F1D1D;}

  /* momentum bar in header area */
  .momentum{display:flex;align-items:center;gap:9px;margin-top:6px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;}
  .momentum .ml{font-size:11px;color:var(--ink-soft);flex:1;font-weight:500;}
  .momentum .ml b{color:var(--ink);font-weight:700;}
  .momentum .mbar{width:80px;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:none;}
  .momentum .mbar i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .4s;}
  .momentum .mbar i.behind{background:#D97706;}
  .momentum .mbar i.bad{background:var(--over);}
  .momentum .marr{font-size:12px;color:var(--ink-faint);}

  /* goal adjust suggestion */
  .gadj{margin-top:14px;padding:12px 14px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .gadj b{color:var(--ink);font-weight:600;}
  .gadj .gadj-row{display:flex;gap:8px;margin-top:10px;}
  .gadj .gadj-row button{flex:1;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px;font-size:12px;font-weight:600;font-family:inherit;color:var(--ink-soft);cursor:pointer;}
  .gadj .gadj-row button.accept{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* baseline + proximity line on metric cards */
  .baseln{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;font-family:"JetBrains Mono",monospace;color:var(--ink-faint);flex-wrap:wrap;}
  .baseln .bdot{width:5px;height:5px;border-radius:50%;background:var(--line-strong);flex:none;}
  .baseln .up{color:var(--green);font-weight:700;}
  .baseln .down{color:var(--over);font-weight:700;}
  .baseln .flat{color:var(--ink-faint);}
  .prox{margin-top:9px;font-size:12px;line-height:1.45;color:var(--accent-ink);font-weight:600;background:var(--accent-soft);border-radius:9px;padding:8px 11px;}
  .prox.cool{color:var(--ink-soft);background:var(--surface-2);font-weight:500;}
  .prox .pe{margin-right:5px;}

  /* "you're closer than you think" banner — Today screen */
  .closer{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--accent-soft);background:linear-gradient(135deg,var(--accent-soft),var(--surface));margin-bottom:10px;}
  .closer .ce{font-size:19px;flex:none;line-height:1.2;}
  .closer .ct2{flex:1;font-size:13px;line-height:1.45;color:var(--ink);}
  .closer .ct2 b{color:var(--accent-ink);font-weight:700;}
  html[data-dark="1"] .closer{background:linear-gradient(135deg,rgba(225,29,72,.12),var(--surface));}

  /* distance traveled card (Trends) */
  .distrav{padding:6px 4px;}
  .distrow{display:flex;align-items:flex-start;gap:11px;padding:12px 12px;border-bottom:1px solid var(--line);}
  .distrow:last-child{border-bottom:none;}
  .distrow .ic{font-size:17px;width:24px;text-align:center;flex:none;margin-top:1px;}
  .distrow .dt{flex:1;font-size:13px;line-height:1.5;color:var(--ink-soft);}
  .distrow .dt b{color:var(--ink);font-weight:700;}
  .distrow .dt .pos{color:var(--green);font-weight:700;}
  .distrow .dt .neg{color:var(--over);font-weight:700;}

  /* milestones / personal records */
  .milerow{display:flex;align-items:center;gap:11px;padding:12px 12px;border-bottom:1px solid var(--line);}
  .milerow:last-child{border-bottom:none;}
  .milerow .mi{font-size:18px;flex:none;}
  .milerow .mt2{flex:1;font-size:13px;line-height:1.4;color:var(--ink-soft);}
  .milerow .mt2 b{color:var(--ink);font-weight:700;}
  .milerow .mbadge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:3px 7px;flex:none;font-family:"JetBrains Mono",monospace;}
</style>
</head>

<script>
"use strict";
/* ---------------- storage ---------------- */
var KEY="tally.v1",mem={};
var hasLS=(function(){try{var k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);return true;}catch(e){return false;}})();
function load(){try{if(hasLS){var r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}return mem[KEY]||null;}catch(e){return null;}}
function save(){try{DB._ts=Date.now();var s=JSON.stringify(DB);if(hasLS)localStorage.setItem(KEY,s);else mem[KEY]=JSON.parse(s);flashSaved();}catch(e){}}

/* ---------------- seeds ---------------- */
function seedHabits(){return [
  {id:"calories",name:"Calories",type:"number",unit:"kcal",target:2250,goal:"at_most",source:"food",ic:"\uD83D\uDD25",active:true,sort:1},
  {id:"protein",name:"Protein",type:"number",unit:"g",target:130,goal:"at_least",source:"food",ic:"\uD83E\uDD5A",active:true,sort:2},
  {id:"sugar",name:"Sugar",type:"number",unit:"g",target:10,goal:"at_most",source:"food",ic:"\uD83C\uDF6C",active:true,sort:3},
  {id:"sleep",name:"Sleep",type:"number",unit:"hrs",target:8,goal:"at_least",control:"slider",min:0,max:12,step:0.5,ic:"\uD83D\uDE34",active:true,sort:4},
  {id:"water",name:"Water",type:"number",unit:"L",target:3.5,goal:"at_least",control:"slider",min:0,max:5,step:0.25,presets:[0.25,0.5,1],ic:"\uD83D\uDCA7",active:true,sort:5},
  {id:"weight",name:"Weight",type:"number",unit:"kgs",target:null,goal:"track",control:"prefill",step:0.1,ic:"\u2696\uFE0F",active:true,sort:6},
  {id:"meditation",name:"Meditation",type:"checkbox",ic:"\uD83E\uDDD8",active:true,sort:7},
  {id:"prayer",name:"Prayer",type:"checkbox",ic:"\uD83D\uDE4F",active:true,sort:8},
  {id:"reading",name:"Reading",type:"checkbox",ic:"\uD83D\uDCD6",active:true,sort:9},
  {id:"creatine",name:"Creatine",type:"checkbox",ic:"\uD83D\uDCAA",active:true,sort:10},
  {id:"collagen",name:"Collagen",type:"checkbox",ic:"\u2728",active:true,sort:11},
  {id:"skincare",name:"Skincare",type:"checkbox",ic:"\uD83E\uDDF4",active:true,sort:12},
  {id:"dm",name:"DM",type:"checkbox",ic:"\uD83D\uDCAC",active:true,sort:13},
  {id:"workout",name:"Work Out",type:"multi",ic:"\uD83C\uDFCB\uFE0F",active:true,sort:14,
    options:["Back & Biceps","Badminton","Chest & Triceps","Core","Legs","Outdoor Run","Rest Day","Rest Day - Sick","Shoulders","Stretches","Swim Class"]},
  {id:"fruits",name:"Fruits",type:"multi",ic:"\uD83C\uDF4E",active:true,sort:15,
    options:["Apple","Avocado","Banana","Berries","Grapes","Kiwi","Lychees","Mandarins","Mango","Olives","Orange","Pineapple","Strawberries"]},
  {id:"veggies",name:"Veggies",type:"multi",ic:"\uD83E\uDD66",active:true,sort:16,
    options:["Arugula","Bell Peppers","Broccoli","Brussels Sprouts","Cabbage","Carrots","Celery","Corn","Cucumber","Drumstick","Eggplant","Kale","Lemon","Lettuce","Mushrooms","Onions","Potatoes","Spinach","Spring Onion","String Beans","Sweet Potato","Tomatoes"]},
  {id:"seeds",name:"Seeds / Nuts / Dryfruits",type:"multi",ic:"\uD83C\uDF30",active:true,sort:17,
    options:["Almonds","Cashews","Chia Seeds","Dates","Groundflax","Hemp Seeds","Pecan","Pista","Raisins","Walnuts"]}
];}
function seedFoods(){return [
  {name:"Coffee",cal:180,protein:8,sugar:0},{name:"Pita bread",cal:190,protein:7,sugar:0},
  {name:"Chili crisp",cal:110,protein:0,sugar:0},{name:"Pesto",cal:125,protein:0,sugar:0},
  {name:"Tofutti",cal:180,protein:2,sugar:0},{name:"Tofu cream chili crisp bagel",cal:760,protein:13,sugar:2},
  {name:"Chickpeas",cal:420,protein:21,sugar:0},{name:"Collagen",cal:80,protein:19,sugar:0},
  {name:"Eggs",cal:210,protein:18,sugar:0},{name:"Koia",cal:110,protein:16,sugar:0},
  {name:"Clio",cal:100,protein:7,sugar:0},{name:"Yogurt",cal:160,protein:11,sugar:5},
  {name:"Quest choc brownie",cal:190,protein:10,sugar:1},{name:"Quest chips",cal:140,protein:19,sugar:0},
  {name:"Chips",cal:280,protein:4,sugar:2},{name:"Cookie",cal:140,protein:2,sugar:14},
  {name:"Oats overnight (bb)",cal:290,protein:20,sugar:8},{name:"Oats overnight (sb+mcc)",cal:280,protein:20,sugar:2},
  {name:"Peas",cal:70,protein:4,sugar:0},{name:"Medium onion",cal:45,protein:1,sugar:0},
  {name:"Whey+collagen+chia (wcc)",cal:285,protein:44,sugar:0},{name:"WCCH",cal:295,protein:45,sugar:0},
  {name:"Magna",cal:15,protein:0,sugar:0},{name:"IH",cal:10,protein:0,sugar:0}
];}

/* ---------------- init ---------------- */
var DB=load();
if(!DB){DB={habits:seedHabits(),entries:{},foods:seedFoods(),goals:{},settings:{}};save();}
if(!DB.foods)DB.foods=seedFoods();
if(!DB.entries)DB.entries={};
if(!DB.habits)DB.habits=seedHabits();
if(!DB.goals)DB.goals={};
if(!DB.settings)DB.settings={};

/* ---------------- date helpers ---------------- */
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseYMD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
var cur=ymd(new Date());
function entry(date){if(!DB.entries[date])DB.entries[date]={values:{},foods:[]};var e=DB.entries[date];if(!e.values)e.values={};if(!e.foods)e.foods=[];return e;}
function activeHabits(){return DB.habits.filter(function(h){return h.active;}).sort(function(a,b){return (a.sort||0)-(b.sort||0);});}
function hbyid(id){return DB.habits.filter(function(h){return h.id===id;})[0];}

/* ---------------- food helpers ---------------- */
function foodTotals(date){var e=entry(date),t={cal:0,protein:0,sugar:0};
  e.foods.forEach(function(f){var q=f.qty||1;t.cal+=(f.cal||0)*q;t.protein+=(f.protein||0)*q;t.sugar+=(f.sugar||0)*q;});
  t.cal=Math.round(t.cal);t.protein=Math.round(t.protein*10)/10;t.sugar=Math.round(t.sugar*10)/10;return t;}
function metricValue(h,date){if(h.source==="food"){var t=foodTotals(date);return t[h.id==="calories"?"cal":h.id]||0;}
  var v=entry(date).values[h.id];return typeof v==="number"?v:0;}
function recentFoods(n){
  var nowH=new Date().getHours();
  var score={};
  var dates=Object.keys(DB.entries).sort().reverse().slice(0,30);
  dates.forEach(function(dt,di){
    (DB.entries[dt].foods||[]).forEach(function(f){
      if(!f.name)return;
      var s=di<3?2:1;
      if(f.t){var fh=new Date(f.t).getHours();var dh=Math.min(Math.abs(fh-nowH),24-Math.abs(fh-nowH));if(dh<=2)s+=3;else if(dh<=4)s+=1;}
      score[f.name]=(score[f.name]||0)+s;
    });
  });
  return Object.keys(score).sort(function(a,b){return score[b]-score[a];}).slice(0,n);
}
function findFoodMacros(name){var f=DB.foods.filter(function(x){return x.name===name;})[0];if(f)return {name:f.name,cal:f.cal,protein:f.protein,sugar:f.sugar};
  var dates=Object.keys(DB.entries).sort().reverse();for(var i=0;i<dates.length;i++){var fs=DB.entries[dates[i]].foods||[];for(var j=0;j<fs.length;j++){if(fs[j].name===name)return {name:name,cal:fs[j].cal,protein:fs[j].protein,sugar:fs[j].sugar};}}return {name:name,cal:0,protein:0,sugar:0};}

/* ---------------- value helpers ---------------- */
function lastKnownValue(id,date){var d=parseYMD(date);for(var i=1;i<=90;i++){var x=new Date(d);x.setDate(d.getDate()-i);var e=DB.entries[ymd(x)];if(e&&e.values&&typeof e.values[id]==="number")return e.values[id];}return null;}
function isDone(h,date){
  if(h.type==="checkbox")return !!entry(date).values[h.id];
  if(h.type==="multi"){var a=entry(date).values[h.id];return Array.isArray(a)&&a.length>0;}
  var v=metricValue(h,date);
  if(h.goal==="at_least")return h.target?v>=h.target:v>0;
  if(h.goal==="at_most")return v>0&&v<=h.target;
  return v>0;
}
function habitScore(h,date){
  if(h.type==="checkbox")return entry(date).values[h.id]?1:0;
  if(h.type==="multi"){var a=entry(date).values[h.id];return Array.isArray(a)&&a.length>0?1:0;}
  var v=metricValue(h,date);if(!v)return 0;
  if(h.goal==="at_least"&&h.target)return Math.min(1,v/h.target);
  if(h.goal==="at_most"&&h.target)return v<=h.target?1:Math.max(0,1-(v-h.target)/h.target);
  return v>0?1:0;
}
function dayFrac(date){
  if(date!==ymd(new Date()))return 1;        // past/future days judged in full
  var now=new Date();
  var mins=now.getHours()*60+now.getMinutes();
  // ramp from 6am (0) to 9pm (full); before 6am give a gentle floor
  var start=6*60,end=21*60;
  if(mins<=start)return 0.12;
  if(mins>=end)return 1;
  return 0.12+(mins-start)/(end-start)*0.88;
}
function dayPct(date){var hs=activeHabits();if(!hs.length)return 0;var total=0;hs.forEach(function(h){total+=habitScore(h,date);});return Math.round(total/hs.length*100);}
function fmtNum(n){return (Math.round(n*100)/100).toString();}
/* ---------------- units ---------------- */
function getUnits(){try{return localStorage.getItem("tally.units")||"metric";}catch(e){return "metric";}}
function setUnits(u){try{localStorage.setItem("tally.units",u);}catch(e){}}
// convert a stored metric value -> display, by unit type
function dispVal(v,unit){
  if(getUnits()!=="imperial")return v;
  if(unit==="L")return Math.round(v*33.814*10)/10;
  if(unit==="kg"||unit==="kgs")return Math.round(v*2.20462*10)/10;
  return v;
}
function dispUnit(unit){
  if(getUnits()!=="imperial")return unit;
  if(unit==="L")return "fl oz";
  if(unit==="kg"||unit==="kgs")return "lb";
  return unit;
}
function toMetric(v,unit){
  if(getUnits()!=="imperial")return v;
  if(unit==="L")return Math.round(v/33.814*1000)/1000;
  if(unit==="kg"||unit==="kgs")return Math.round(v/2.20462*100)/100;
  return v;
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ---------------- header ---------------- */
function renderHeader(){
  var d=parseYMD(cur),today=ymd(new Date());
  var dows=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var mons=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var hr=new Date().getHours();
  var greet=hr<5?"Late night \uD83C\uDF19":hr<12?"Morning \u2600\uFE0F":hr<17?"Afternoon \uD83C\uDF24\uFE0F":hr<21?"Evening \uD83C\uDF06":"Night \uD83C\uDF19";
  document.getElementById("dow").textContent=cur===today?greet:dows[d.getDay()];
  document.getElementById("fdate").textContent=dows[d.getDay()].slice(0,3)+", "+mons[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()+(cur===today?"  \u25BE":"");
  var dnavEl=document.getElementById("dnav");
  if(dnavEl){dnavEl.classList.toggle("away",cur!==today);}
  var pct=dayPct(cur),R=20,C=2*Math.PI*R,off=C*(1-pct/100);
  document.getElementById("ring").innerHTML=
    '<svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="'+R+'" fill="none" stroke="#E7E5E4" stroke-width="5"/>'+
    '<circle cx="24" cy="24" r="'+R+'" fill="none" stroke="#E11D48" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" style="transition:stroke-dashoffset .6s cubic-bezier(.3,1,.4,1)"/></svg><div class="pct">'+pct+'%</div>';
  var ringEl=document.getElementById("ring");
  ringEl.classList.toggle("full",pct>=100);
  if(pct>=100&&cur===today){try{if(localStorage.getItem("tally.party")!==today){localStorage.setItem("tally.party",today);setTimeout(function(){burst(ringEl);toast("100% day \uD83C\uDF89");},300);}}catch(e){}}
}

/* ---------------- TODAY render ---------------- */

/* ===== motivation layer: baselines, proximity, distance, milestones ===== */
// rolling average of a metric over the last n logged days (excluding today), in metric units
function rollingAvg(h,n,beforeDate){
  var base=beforeDate?parseYMD(beforeDate):parseYMD(cur);
  var vals=[];
  for(var i=1;i<=n*2&&vals.length<n;i++){
    var x=new Date(base);x.setDate(base.getDate()-i);
    var v=metricDayVal(h,ymd(x));
    if(v!=null)vals.push(v);
  }
  if(!vals.length)return null;
  return vals.reduce(function(a,b){return a+b;},0)/vals.length;
}
// average over a window that starts further back (for "distance traveled")
function avgInWindow(h,startDaysAgo,spanDays){
  var base=parseYMD(cur),vals=[];
  for(var i=startDaysAgo;i<startDaysAgo+spanDays;i++){
    var x=new Date(base);x.setDate(base.getDate()-i);
    var v=metricDayVal(h,ymd(x));
    if(v!=null)vals.push(v);
  }
  if(!vals.length)return null;
  return vals.reduce(function(a,b){return a+b;},0)/vals.length;
}
// build the "you're closer than you think" proximity message for a metric (today only)
// returns {msg, warm} or null
function proximityFor(h){
  if(!h.target||h.goal==="track"||cur!==ymd(new Date()))return null;
  var v=metricValue(h,cur);
  var uShow=(h.id==="water"||h.id==="weight"||h.unit==="L"||h.unit==="kg"||h.unit==="kgs");
  var hUnit=(h.unit==="L"||h.unit==="kg"||h.unit==="kgs")?h.unit:(h.id==="weight"?"kg":(h.unit||""));
  var dU=uShow?dispUnit(hUnit):(h.unit||"");
  function disp(x){return fmtNum(Math.round((uShow?dispVal(x,hUnit):x)*10)/10);}
  if(h.goal==="at_least"){
    if(v>=h.target)return null; // already hit — milestone handles celebration
    var gap=h.target-v;var pct=v/h.target;
    if(pct>=0.7){
      // close — encourage hard
      var hint="";
      if(h.id==="protein")hint=" One shake or a handful of nuts does it.";
      else if(h.id==="water")hint=" A glass or two and you're there.";
      return {msg:"You're <b>"+disp(gap)+" "+esc(dU)+"</b> from your "+esc(h.name.toLowerCase())+" goal — so close now."+hint,warm:true};
    }
    if(pct>=0.45)return {msg:"Past halfway on "+esc(h.name.toLowerCase())+" — "+disp(gap)+" "+esc(dU)+" to go.",warm:false};
    return null;
  }
  if(h.goal==="at_most"){
    if(v>h.target)return null; // over — not a proximity moment
    if(v<=0)return null;
    var room=h.target-v;var rpct=room/h.target;
    if(rpct<=0.18&&rpct>0)return {msg:"<b>"+disp(room)+" "+esc(dU)+"</b> of "+esc(h.name.toLowerCase())+" room left today — hold the line, you've got this.",warm:true};
    return null;
  }
  return null;
}
// baseline comparison line for a metric card
function baselineLine(h){
  if(h.goal==="track"||!h.target)return ""; // tracked-only handled elsewhere
  var v=metricValue(h,cur);
  if(!v)return "";
  var base=rollingAvg(h,14,cur);
  if(base==null)return "";
  var uShow=(h.id==="water"||h.id==="weight"||h.unit==="L"||h.unit==="kg"||h.unit==="kgs");
  var hUnit=(h.unit==="L"||h.unit==="kg"||h.unit==="kgs")?h.unit:(h.id==="weight"?"kg":(h.unit||""));
  var dU=uShow?dispUnit(hUnit):(h.unit||"");
  function disp(x){return fmtNum(Math.round((uShow?dispVal(x,hUnit):x)*10)/10);}
  var diff=v-base;
  var better=(h.goal==="at_least"&&diff>0)||(h.goal==="at_most"&&diff<0);
  var worse=(h.goal==="at_least"&&diff<0)||(h.goal==="at_most"&&diff>0);
  var cls=Math.abs(diff)<base*0.04?"flat":(better?"up":(worse?"down":"flat"));
  var word=cls==="flat"?"right at":(better?"above":"below");
  var arrow=cls==="up"?"\u2191":cls==="down"?"\u2193":"\u2192";
  return '<div class="baseln"><span class="bdot"></span><span>'+disp(base)+' '+esc(dU)+' 14-day avg</span><span class="'+cls+'">'+arrow+' '+word+' your usual</span></div>';
}
// personal records detection — returns array of {icon,text,badge}
function detectMilestones(){
  var out=[],todayY=ymd(new Date());
  // streak records for checkbox habits
  activeHabits().filter(function(h){return h.type==="checkbox";}).forEach(function(h){
    var cur2=streakOf(h);
    if(cur2<3)return;
    // find best prior streak (scan 365 days)
    var best=0,run=0,d=parseYMD(todayY);
    for(var i=0;i<365;i++){var x=new Date(d);x.setDate(d.getDate()-i);if(isDone(h,ymd(x))){run++;if(run>best)best=run;}else run=0;}
    // current streak is part of best; check if today set a NEW record (today done AND current==best AND best>previous best)
    if(isDone(h,todayY)&&cur2===best&&cur2>3){
      // was yesterday's streak less? meaning today extended to a record
      var prevBest=0,run2=0;var dd=parseYMD(todayY);
      for(var j=1;j<366;j++){var x2=new Date(dd);x2.setDate(dd.getDate()-j);if(isDone(h,ymd(x2))){run2++;if(run2>prevBest)prevBest=run2;}else run2=0;}
      if(cur2>prevBest)out.push({icon:h.ic||"\uD83C\uDFC6",text:"<b>"+esc(h.name)+"</b> — "+cur2+" days in a row, your longest ever.",badge:"record"});
    }
  });
  return out;
}
// milestone proximity — "one more and it's a record" (checkbox streaks)
function milestoneProximity(){
  var out=[],todayY=ymd(new Date());
  activeHabits().filter(function(h){return h.type==="checkbox";}).forEach(function(h){
    if(isDone(h,todayY))return; // already done today
    // current streak as of yesterday
    var run=0,d=new Date();
    for(var i=1;i<366;i++){var x=new Date(d);x.setDate(d.getDate()-i);if(isDone(h,ymd(x)))run++;else break;}
    if(run<3)return;
    // best ever streak
    var best=0,r2=0,dd=parseYMD(todayY);
    for(var j=0;j<366;j++){var x2=new Date(dd);x2.setDate(dd.getDate()-j);if(isDone(h,ymd(x2))){r2++;if(r2>best)best=r2;}else r2=0;}
    if(run+1>best&&run>=3)out.push({h:h,run:run});
  });
  return out;
}
// fire a one-time celebration when a new personal-record streak is set today
function checkRecords(){
  if(cur!==ymd(new Date()))return;
  var recs=detectMilestones();
  if(!recs.length)return;
  var todayY=ymd(new Date());
  var seen={};try{seen=JSON.parse(localStorage.getItem("tally.records")||"{}");}catch(e){}

}

/* ---------------- nudge system ---------------- */
var NUDGE_KEY="tally.nudgedismiss";
function getDismissed(){try{return JSON.parse(localStorage.getItem(NUDGE_KEY)||"{}");}catch(e){return {};}}
function dismissNudge(id){var d=getDismissed();d[id]=ymd(new Date());try{localStorage.setItem(NUDGE_KEY,JSON.stringify(d));}catch(e){}renderToday();}
function wasNudgeDismissedToday(id){var d=getDismissed();return d[id]===ymd(new Date());}

function buildNudges(hr,hs){
  var nudges=[],todayYmd=ymd(new Date()),dismissed=getDismissed();
  function add(id,icon,msg,cls){if(dismissed[id]===todayYmd)return;nudges.push({id:id,icon:icon,msg:msg,cls:cls||""});}

  // 1. Protein logging nudge after workout logged
  var wkH=hbyid("workout");var proH=hbyid("protein");
  if(wkH&&wkH.active&&proH&&proH.active&&hr>=10){
    var wkDone=entry(todayYmd).values.workout;
    if(Array.isArray(wkDone)&&wkDone.filter(function(x){return x.toLowerCase().indexOf("rest")<0;}).length>0){
      var proVal=foodTotals(todayYmd).protein||0;
      var proNeeded=(proH.target||130)*0.4;
      if(proVal<proNeeded)add("workout_protein","\uD83D\uDCAA","<b>Workout logged.</b> Still need "+fmtNum(Math.round(proNeeded-proVal))+"g protein to hit 40% of your goal. Log a shake?","warn");
    }
  }

  // 2. Mid-afternoon water check
  if(hr>=14&&hr<18){
    var wH=hbyid("water");
    if(wH&&wH.active){
      var wVal=entry(todayYmd).values.water||0;
      var wNeeded=(wH.target||3.5)*0.6;
      if(wVal<wNeeded)add("water_pm","\uD83D\uDCA7","You've had <b>"+fmtNum(Math.round(dispVal(wVal,"L")*10)/10)+" "+dispUnit("L")+"</b> — should be past "+fmtNum(Math.round(dispVal(wNeeded,"L")*10)/10)+" "+dispUnit("L")+" by now.","warn");
    }
  }

  // 3. Slip detection — 3+ day miss on a checkbox habit
  checks_outer:
  for(var ci=0;ci<hs.length;ci++){
    var sh=hs[ci];if(sh.type!=="checkbox")continue;
    if(isDone(sh,todayYmd))continue;
    var missCount=0;
    for(var mi=1;mi<=4;mi++){var pd=new Date();pd.setDate(pd.getDate()-mi);if(!isDone(sh,ymd(pd)))missCount++;else break;}
    if(missCount>=3){add("slip_"+sh.id,sh.ic||"\u26A0\uFE0F","<b>"+esc(sh.name)+"</b> hasn't been ticked in "+missCount+" days. Still tracking this?","slip");break checks_outer;}
  }

  // 4. Sugar weekend pattern (only Sat/Sun, afternoon)
  if(hr>=13){var dow=new Date().getDay();if(dow===0||dow===6){var sugarH2=hbyid("sugar");if(sugarH2&&sugarH2.active&&sugarH2.target){var sVal=foodTotals(todayYmd).sugar||0;if(sVal>sugarH2.target*0.7)add("sugar_weekend","\uD83C\uDF6C","Sugar is at <b>"+fmtNum(sVal)+"g</b> — weekends tend to push you over. Watch it going into the evening.","warn");}}}

  // limit to 2 nudges max to avoid overwhelming
  return nudges.slice(0,2);
}

/* ---------------- momentum score (monthly goal progress) ---------------- */
function buildMomentum(){
  var ym=new Date().getFullYear()+"-"+String(new Date().getMonth()+1).padStart(2,"0");
  var goals=DB.goals[ym];if(!goals||!Object.keys(goals).length)return "";
  var today=new Date(),dom=today.getDate(),daysInMonth=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  var paceExpected=dom/daysInMonth;
  var scores=[];
  activeHabits().forEach(function(h){
    var g=goals[h.id];if(g==null)return;
    var dates=monthDates(today.getFullYear(),today.getMonth());
    var st=monthStats(h,dates);
    var actual,expected;
    if(h.type==="checkbox"||h.type==="multi"){actual=st.daysDone/g;expected=paceExpected;}
    else if(h.type==="number"&&h.goal!=="track"&&h.control!=="prefill"){actual=st.daysHit/g;expected=paceExpected;}
    else return;
    scores.push({actual:actual,expected:expected,name:h.name,ic:h.ic||""});
  });
  if(!scores.length)return "";
  var onTrack=scores.filter(function(s){return s.actual>=s.expected*0.85;}).length;
  var total=scores.length;
  var pct=Math.round(onTrack/total*100);
  var barCls=pct>=75?"":"behind";if(pct<40)barCls="bad";
  var lbl=pct>=75?"On track for "+onTrack+"/"+total+" monthly goals":pct>=40?"Behind on "+(total-onTrack)+" of "+total+" goals":"Off pace on most goals — worth a look";
  return '<div class="momentum"><span style="font-size:15px;">\uD83D\uDCCA</span><span class="ml">'+lbl+'</span><div class="mbar"><i class="'+barCls+'" style="width:'+Math.min(100,pct)+'%"></i></div><span class="marr">\u203A</span></div>';
}

/* ---------------- closer-than-you-think + past-self + milestone proximity ---------------- */
function buildClosers(hr){
  var out=[],todayY=ymd(new Date());

  // A) Milestone proximity — one away from a personal-best streak (strongest pull, show first)
  var mp=milestoneProximity();
  if(mp.length){
    var m0=mp[0];
    out.push({icon:"\uD83C\uDFC6",msg:"One more day and <b>"+esc(m0.h.name)+"</b> becomes your longest streak ever ("+(m0.run+1)+" days). Don't break it now."});
  }

  // B) Day-completion proximity — evening, close to a full day
  if(hr>=16){
    var p=dayPct(todayY);
    if(p>=70&&p<100){
      var left=activeHabits().filter(function(h){return habitScore(h,todayY)<1;}).length;
      out.push({icon:"\uD83C\uDFAF",msg:"You're at <b>"+p+"%</b> — just "+left+" thing"+(left===1?"":"s")+" between you and a full day. So close."});
    }
  }

  // C) Monthly goal proximity — a goal that's reachable in the days remaining
  var ym=new Date().getFullYear()+"-"+String(new Date().getMonth()+1).padStart(2,"0");
  var goals=DB.goals[ym];
  if(goals){
    var today=new Date(),daysInMonth=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
    var daysLeft=daysInMonth-today.getDate()+1;
    var dates=monthDates(today.getFullYear(),today.getMonth());
    var picked=null;
    activeHabits().forEach(function(h){
      if(picked)return;
      var g=goals[h.id];if(g==null)return;
      if(h.type==="checkbox"||h.type==="multi"){
        var st=monthStats(h,dates);var need=g-st.daysDone;
        if(need>0&&need<=daysLeft&&need<=Math.max(2,Math.ceil(daysLeft*0.6))){
          picked={icon:"\uD83D\uDCC5",msg:"<b>"+esc(h.name)+"</b>: "+need+" more day"+(need===1?"":"s")+" this month hits your goal, and you've got "+daysLeft+" left. Very doable."};
        }
      } else if(h.type==="number"&&h.goal!=="track"&&h.control!=="prefill"){
        var st2=monthStats(h,dates);var need2=g-st2.daysHit;
        if(need2>0&&need2<=daysLeft&&need2<=Math.max(2,Math.ceil(daysLeft*0.6))){
          picked={icon:"\uD83D\uDCC5",msg:"<b>"+esc(h.name)+"</b>: hit your target "+need2+" more day"+(need2===1?"":"s")+" to reach this month's goal. "+daysLeft+" days left — within reach."};
        }
      }
    });
    if(picked)out.push(picked);
  }

  // D) Past-self benchmark — how today compares to same weekday last week, at this hour
  if(hr>=11&&hr<=22){
    var lw=new Date();lw.setDate(lw.getDate()-7);var lwY=ymd(lw);
    var pToday=dayPct(todayY),pLast=dayPct(lwY);
    // only show if last week had real activity and you're ahead (encouraging) — avoids discouraging compares
    if(pLast>=20&&pToday>pLast+8){
      out.push({icon:"\u23F1\uFE0F",msg:"Last "+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][lw.getDay()]+" you were at "+pLast+"% by now. Today you're already at <b>"+pToday+"%</b> — ahead of your own pace."});
    }
  }

  // cap at 2 so the screen stays calm
  return out.slice(0,2);
}


var _gadjPending=null;
function checkGoalAdjust(){
  // runs once per week render — find a habit where 0/7 days hit
  var d7=lastDates(7);
  var candidates=[];
  activeHabits().forEach(function(h){
    if(h.type!=="number"||!h.target||h.goal==="track"||h.control==="prefill")return;
    var vals=d7.map(function(dt){return metricDayVal(h,dt);}).filter(function(x){return x!=null;});
    if(vals.length<4)return;
    var hits=vals.filter(function(v){return h.goal==="at_least"?v>=h.target:v<=h.target;}).length;
    if(hits===0)candidates.push({h:h,avg:vals.reduce(function(a,b){return a+b;},0)/vals.length});
  });
  if(!candidates.length)return;
  var c=candidates[0];var h=c.h;
  var avg=Math.round(c.avg*10)/10;
  var suggested;
  if(h.goal==="at_least")suggested=Math.round(avg*0.85*10)/10;
  else suggested=Math.round(avg*1.15*10)/10;
  var key="tally.gadj_dismiss";
  try{var dval=localStorage.getItem(key);if(dval===h.id+"_"+suggested)return;}catch(e){}
  _gadjPending={hid:h.id,hname:h.name,suggested:suggested,direction:h.goal==="at_least"?"down":"up"};
}
function applyGoalAdjust(){
  if(!_gadjPending)return;
  var h=hbyid(_gadjPending.hid);if(!h)return;
  h.target=_gadjPending.suggested;
  _gadjPending=null;
  save();renderSettings();toast("Goal updated");
}
function dismissGoalAdjust(){
  if(!_gadjPending)return;
  try{localStorage.setItem("tally.gadj_dismiss",_gadjPending.hid+"_"+_gadjPending.suggested);}catch(e){}
  _gadjPending=null;
  renderSettings();
}


/* ---------------- TRENDS ---------------- */
var trendMode="week",trendMonth=new Date();

/* distance traveled — how far you've come, in plain language */
function distanceTraveled(){
  var rows="";
  activeHabits().forEach(function(h){
    if(h.type==="number"){
      // compare recent 30d avg vs the 30d window before that (days 30-60 ago), and an older anchor (60-90)
      var recent=avgInWindow(h,0,30);
      var older=avgInWindow(h,60,30);
      if(recent==null||older==null)return;
      var uShow=(h.id==="water"||h.id==="weight"||h.unit==="L"||h.unit==="kg"||h.unit==="kgs");
      var hUnit=(h.unit==="L"||h.unit==="kg"||h.unit==="kgs")?h.unit:(h.id==="weight"?"kg":(h.unit||""));
      var dU=uShow?dispUnit(hUnit):(h.unit||"");
      function disp(x){return fmtNum(Math.round((uShow?dispVal(x,hUnit):x)*10)/10);}
      var diff=recent-older;
      if(Math.abs(diff)<older*0.05)return; // not enough movement to be a story
      var better=(h.goal==="at_least"&&diff>0)||(h.goal==="at_most"&&diff<0)||(h.goal==="track");
      var sign=diff>0?"+":"";
      var cls=better?"pos":"neg";
      var dir=diff>0?"up":"down";
      var txt;
      if(h.goal==="track"){
        txt="Your 30-day avg <b>"+esc(h.name.toLowerCase())+"</b> is <b>"+disp(recent)+" "+esc(dU)+"</b>. Two months ago it was "+disp(older)+". That's a <span class='"+cls+"'>"+sign+disp(diff)+" "+esc(dU)+"</span> shift.";
      } else {
        txt="Your <b>"+esc(h.name.toLowerCase())+"</b> went from "+disp(older)+" to <b>"+disp(recent)+" "+esc(dU)+"</b>/day over the last two months — <span class='"+cls+"'>"+(better?"the right direction":"drifting")+"</span>. You're a "+sign+disp(diff)+" "+esc(dU)+" person now.";
      }
      rows+='<div class="distrow"><span class="ic">'+(h.ic||"\u2022")+'</span><span class="dt">'+txt+'</span></div>';
    } else if(h.type==="checkbox"){
      // days done recent 30 vs prior 30
      var c1=0,c2=0,base=parseYMD(cur);
      for(var i=0;i<30;i++){var x=new Date(base);x.setDate(base.getDate()-i);if(isDone(h,ymd(x)))c1++;}
      for(var j=30;j<60;j++){var y=new Date(base);y.setDate(base.getDate()-j);if(isDone(h,ymd(y)))c2++;}
      if(c1===0&&c2===0)return;
      if(c1>c2+2){
        rows+='<div class="distrow"><span class="ic">'+(h.ic||"\u2022")+'</span><span class="dt"><b>'+esc(h.name)+'</b> — '+c1+' days this past month vs '+c2+' the month before. <span class="pos">Building</span>.</span></div>';
      }
    }
  });
  if(!rows)return "";
  return '<div class="section"><div class="shead"><h2>How far you\u2019ve come</h2><span class="meta">last 60 days</span></div><div class="card distrav">'+rows+'</div></div>';
}

/* milestones — personal records, surfaced gently in Trends */
function milestonesCard(){
  var rows="";
  // best-ever streaks for checkboxes
  activeHabits().filter(function(h){return h.type==="checkbox";}).forEach(function(h){
    var best=0,run=0,d=parseYMD(cur);
    for(var i=0;i<365;i++){var x=new Date(d);x.setDate(d.getDate()-i);if(isDone(h,ymd(x))){run++;if(run>best)best=run;}else run=0;}
    if(best>=5){
      var curS=streakOf(h);
      var isNow=curS===best&&curS>0;
      rows+='<div class="milerow"><span class="mi">'+(h.ic||"\uD83C\uDFC6")+'</span><span class="mt2"><b>'+esc(h.name)+'</b> — best streak '+best+' days'+(isNow?', and you\u2019re on it right now':'')+'.</span>'+(isNow?'<span class="mbadge">live</span>':'')+'</div>';
    }
  });
  // best week for number metrics (highest weekly avg of hit-days)
  activeHabits().filter(function(h){return h.type==="number"&&h.target&&h.goal!=="track"&&h.control!=="prefill";}).forEach(function(h){
    // best single day ever (closest to / beyond target)

      if(h.goal==="at_least"){if(bestV==null||v>bestV)bestV=v;}else{if(v>0&&(bestV==null||v<bestV))bestV=v;}}

    var uShow=(h.id==="water"||h.id==="weight"||h.unit==="L"||h.unit==="kg"||h.unit==="kgs");
    var hUnit=(h.unit==="L"||h.unit==="kg"||h.unit==="kgs")?h.unit:(h.id==="weight"?"kg":(h.unit||""));
    var dU=uShow?dispUnit(hUnit):(h.unit||"");
    var bv=fmtNum(Math.round((uShow?dispVal(bestV,hUnit):bestV)*10)/10);
    rows+='<div class="milerow"><span class="mi">'+(h.ic||"\u2B50")+'</span><span class="mt2">Your best <b>'+esc(h.name.toLowerCase())+'</b> day: '+bv+' '+esc(dU)+'.</span></div>';
  });
  if(!rows)return "";
  return '<div class="section"><div class="shead"><h2>Personal records</h2><span class="meta">your bests</span></div><div class="card streaks">'+rows+'</div></div>';

function lastDates(n){var out=[],d=parseYMD(cur);for(var i=n-1;i>=0;i--){var x=new Date(d);x.setDate(d.getDate()-i);out.push(ymd(x));}return out;}
function sparkline(h,days){
  var pts=days.map(function(dt){
    var v;
    if(h.source==="food"){var ft=foodTotals(dt);v=ft[h.id==="calories"?"cal":h.id];if(!v&&!(DB.entries[dt]&&DB.entries[dt].foods&&DB.entries[dt].foods.length))v=null;}
    else{var e=DB.entries[dt];v=e&&e.values&&typeof e.values[h.id]==="number"?e.values[h.id]:null;}
    return typeof v==="number"?v:null;
  });
  var have=pts.filter(function(p){return p!==null;});
  if(have.length<2)return '<div class="spark"><div class="lab"><span class="t">'+(h.ic||"")+' '+esc(h.name)+'</span><span class="v">not enough data</span></div></div>';
  var mn=Math.min.apply(null,have),mx=Math.max.apply(null,have),rng=(mx-mn)||1;
  var W=270,H=58,LW=38,pad=6,n=pts.length;
  var coords=pts.map(function(p,i){
    return {x:LW+(n>1?i/(n-1)*W:0),y:p===null?null:pad+(H-pad*2)*(1-(p-mn)/rng),v:p};
  });
  var dpath="",started=false;
  coords.forEach(function(c){if(c.y===null)return;dpath+=(started?"L":"M")+c.x.toFixed(1)+" "+c.y.toFixed(1)+" ";started=true;});
  var dots=coords.filter(function(c){return c.y!==null;}).map(function(c){
    return '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="3" fill="#E11D48"/>';
  }).join("");
  var fv=function(v){var su2=(h.unit==="kg"||h.unit==="kgs"||h.unit==="L");return Math.round((su2?dispVal(v,h.unit):v)*10)/10;};
  var dU=((h.unit==="kg"||h.unit==="kgs"||h.unit==="L")?dispUnit(h.unit):h.unit)||"";
  var goalLine="";
  if(h.target&&h.goal!=="track"){
    var gtv=h.target;
    if(gtv>=mn&&gtv<=mx){
      var gy=(pad+(H-pad*2)*(1-(gtv-mn)/rng)).toFixed(1);
      var gx2=(LW+W).toString();
      goalLine='<line x1="'+LW+'" y1="'+gy+'" x2="'+gx2+'" y2="'+gy+'" stroke="#D6D3D1" stroke-width="1.5" stroke-dasharray="4,3"/>'+
        '<text x="'+(LW+W+4)+'" y="'+(parseFloat(gy)+3)+'" fill="#A8A29E" font-size="8" font-family="monospace">goal</text>';
    }
  }
  var yTop='<text x="'+(LW-4)+'" y="'+(pad+5)+'" fill="#A8A29E" font-size="9" font-family="monospace" text-anchor="end">'+fv(mx)+'</text>';
  var yBot='<text x="'+(LW-4)+'" y="'+(H-2)+'" fill="#A8A29E" font-size="9" font-family="monospace" text-anchor="end">'+fv(mn)+'</text>';
  var totalW=LW+W+32;
  var rangeTxt=have.length>1?'<div style="font-size:10px;color:var(--ink-faint);font-family:monospace;margin-top:1px;letter-spacing:-.01em;">'+fv(mn)+' \u2013 '+fv(mx)+' '+esc(dU)+'</div>':"";
  return '<div class="spark"><div class="lab"><span class="t">'+(h.ic||"")+' '+esc(h.name)+'</span><span class="v">'+fv(have[have.length-1])+' '+esc(dU)+'</span></div>'+
    rangeTxt+
    '<svg viewBox="0 0 '+totalW+' '+H+'" width="100%" style="overflow:visible;margin-top:4px;display:block;">'+
    yTop+yBot+goalLine+
    '<path d="'+dpath+'" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    dots+'</svg></div>';
}

function streakOf(h){var d=parseYMD(cur),c=0;for(var i=0;i<400;i++){var x=new Date(d);x.setDate(d.getDate()-i);if(isDone(h,ymd(x)))c++;else break;}return c;}
function monthDates(year,month){var out=[],n=new Date(year,month+1,0).getDate();for(var i=1;i<=n;i++)out.push(ymd(new Date(year,month,i)));return out;}
function monthStats(h,dates){
  var todayY=ymd(new Date());
  var vals=[],daysHit=0,daysDone=0,logged=0,first=null,last=null;
  dates.forEach(function(dt){
    if(dt>todayY)return;
    var e=DB.entries[dt];
    if(h.type==="number"){var v=e&&e.values?e.values[h.id]:undefined;if(h.source==="food"){var ft=foodTotals(dt);v=ft[h.id==="calories"?"cal":h.id];if(v===0&&(!e||!e.foods||!e.foods.length))v=undefined;}
      if(typeof v==="number"){vals.push(v);if(first===null)first=v;last=v;logged++;
        if(h.goal==="at_least"&&h.target&&v>=h.target)daysHit++;if(h.goal==="at_most"&&h.target&&v<=h.target&&v>0)daysHit++;}}
    else if(isDone(h,dt)){daysDone++;}
  });
  var avg=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null;
  return {avg:avg,daysHit:daysHit,daysDone:daysDone,logged:logged,first:first,last:last,count:vals.length};
}
function elapsedDays(year,month){var today=new Date();var end=new Date(year,month+1,0);var start=new Date(year,month,1);
  if(today<start)return 0;if(today>end)return end.getDate();return today.getDate();}

    // calendar heatmap

var _pop=null;
function flushPop(){

    if(els[i].getAttribute(_pop.a)===_pop.v){

function burst(from){
  var r=from.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  var ac="#E11D48";try{ac=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||ac;}catch(e){}
  var cols=[ac,"#F59E0B","#10B981","#3B82F6","#A855F7",ac];
  for(var i=0;i<26;i++){
    var p=document.createElement("div");p.className="confetti";
    p.style.left=cx+"px";p.style.top=cy+"px";
    p.style.background=cols[i%cols.length];
    p.style.setProperty("--dx",(Math.random()*220-110)+"px");
    p.style.setProperty("--up",(-(50+Math.random()*90))+"px");
    p.style.setProperty("--dn",(150+Math.random()*210)+"px");
    p.style.setProperty("--rz",(Math.random()*640-320)+"deg");
    p.style.animationDelay=(Math.random()*.1)+"s";
    document.body.appendChild(p);
    (function(el){setTimeout(function(){el.remove();},1500);})(p);
  }
}

  var f={
    protein:!!(ph&&ph.active&&ph.target&&t.protein>=ph.target),
    water:!!(wh&&wh.active&&wh.target&&(entry(cur).values.water||0)>=wh.target)
  };

/* ---------------- count-up totals ---------------- */
var _prevTots=null,_countUpRAF=null;
function countUpTots(){
  if(_countUpRAF){cancelAnimationFrame(_countUpRAF);_countUpRAF=null;}
  var t=foodTotals(cur);
  var now={day:cur,cal:t.cal||0,protein:t.protein||0,sugar:t.sugar||0};
  if(_prevTots&&_prevTots.day===cur){
    var els=document.querySelectorAll(".tots .tot");
    var hsF=activeHabits().filter(function(h){return h.source==="food";});
    hsF.forEach(function(h,i){
      var key=h.id==="calories"?"cal":h.id;
      var from=_prevTots[key],to=now[key];
      if(from===to||!els[i])return;
      var span=els[i].querySelector(".tv span");if(!span)return;
      var t0=performance.now(),dur=450;
      requestAnimationFrame(function step(ts){
        var p=Math.min(1,(ts-t0)/dur);p=1-Math.pow(1-p,3);
        span.textContent=fmtNum(Math.round((from+(to-from)*p)*10)/10);
        if(p<1)_countUpRAF=requestAnimationFrame(step);else _countUpRAF=null;
      });
    });
  }
  _prevTots=now;
}

/* ---------------- mentor: weekly read + scorecard ---------------- */
function metricDayVal(h,dt){
  var e=DB.entries[dt];
  if(h.source==="food"){
    var ft=foodTotals(dt);var v=ft[h.id==="calories"?"cal":h.id]||0;
    return (v>0||(e&&e.foods&&e.foods.length))?v:null;
  }
  var v2=e&&e.values?e.values[h.id]:undefined;
  return typeof v2==="number"?v2:null;
}
function weekRead(){
  var d7=lastDates(7),dp=lastDates(14).slice(0,7),d28=lastDates(28);
  var wins=[],focus=[];
  activeHabits().forEach(function(h){
    if(h.type==="number"){
      var cu=d7.map(function(dt){return metricDayVal(h,dt);}).filter(function(x){return x!=null;});
      var pr=dp.map(function(dt){return metricDayVal(h,dt);}).filter(function(x){return x!=null;});
      if(cu.length<3)return;
      var a1=cu.reduce(function(a,b){return a+b;},0)/cu.length;
      var a2=pr.length>=3?pr.reduce(function(a,b){return a+b;},0)/pr.length:null;
      if(h.target&&h.goal==="at_least"){
        var hits=cu.filter(function(v){return v>=h.target;}).length;
        if(hits>=5)wins.push({s:hits/cu.length+0.2,txt:esc(h.name)+" hit goal "+hits+" of "+cu.length+" logged days"});
        else if(hits<=2&&cu.length>=4)focus.push({s:1-hits/cu.length,txt:esc(h.name)+" hit goal only "+hits+" of "+cu.length+" days. Small daily moves beat one big push"});
      }
      if(h.target&&h.goal==="at_most"){
        var unders=cu.filter(function(v){return v<=h.target;}).length;
        if(unders>=5)wins.push({s:unders/cu.length,txt:esc(h.name)+" stayed under the limit "+unders+" of "+cu.length+" days"});
        else if(unders<=2&&cu.length>=4)focus.push({s:1-unders/cu.length,txt:esc(h.name)+" went over "+(cu.length-unders)+" of "+cu.length+" days. Worth a closer look"});
      }
      if(a2!=null&&Math.abs(a2)>0.0001&&h.goal!=="track"&&h.control!=="prefill"){
        var rel=(a1-a2)/Math.abs(a2);
        if(Math.abs(rel)>=0.1){
          var d=fmtNum(Math.round(Math.abs(a1-a2)*10)/10)+" "+(h.unit||"")+"/day vs last week";
          if((h.goal==="at_least"&&rel>0)||(h.goal==="at_most"&&rel<0))wins.push({s:Math.abs(rel),txt:esc(h.name)+" trending the right way, "+(rel>0?"up ":"down ")+d});
          else focus.push({s:Math.abs(rel),txt:esc(h.name)+" "+(rel>0?"up ":"down ")+d});
        }
      }
    } else if(h.type==="checkbox"){
      var done7=d7.filter(function(dt){return isDone(h,dt);}).length;
      if(done7===7)wins.push({s:1.3,txt:esc(h.name)+" all 7 days. Locked in"});
    }
  });
  var pattern=null;
  var sugarH=hbyid("sugar");
  if(sugarH&&sugarH.active){
    var we=[],wd=[];
    d28.forEach(function(dt){var v=metricDayVal(sugarH,dt);if(v==null)return;var day=parseYMD(dt).getDay();(day===0||day===6?we:wd).push(v);});
    if(we.length>=3&&wd.length>=6){
      var aw=we.reduce(function(a,b){return a+b;},0)/we.length,ad=wd.reduce(function(a,b){return a+b;},0)/wd.length;
      if(aw>ad*1.3&&aw-ad>=3)pattern="Sugar runs higher on weekends: "+Math.round(aw)+"g vs "+Math.round(ad)+"g weekdays. Plan the weekend treat, do not let it plan you.";
    }
  }
  if(!pattern){
    var slH=hbyid("sleep");
    if(slH&&slH.active){
      var sw=[],sr=[];
      d28.forEach(function(dt){var e=DB.entries[dt];if(!e||!e.values||typeof e.values.sleep!=="number")return;
        var wk=Array.isArray(e.values.workout)&&e.values.workout.filter(function(x){return x.toLowerCase().indexOf("rest")<0;}).length>0;
        (wk?sw:sr).push(e.values.sleep);});
      if(sw.length>=4&&sr.length>=4){
        var s1=sw.reduce(function(a,b){return a+b;},0)/sw.length,s2=sr.reduce(function(a,b){return a+b;},0)/sr.length;
        if(s1<s2-0.7)pattern="You sleep "+(Math.round((s2-s1)*10)/10)+"h less on workout days. Guard the bedtime after training.";
        else if(s1>s2+0.7)pattern="You sleep better on workout days, +"+(Math.round((s1-s2)*10)/10)+"h. Training is earning you rest.";
      }
    }
  }
  wins.sort(function(a,b){return b.s-a.s;});focus.sort(function(a,b){return b.s-a.s;});
  var out=[];
  if(wins.length)out.push("\uD83D\uDCAA "+wins[0].txt+".");
  if(focus.length)out.push("\uD83C\uDFAF "+focus[0].txt+".");
  if(pattern)out.push("\uD83D\uDD0D "+pattern);
  if(!out.length)return "";
  return '<div class="section"><div class="shead"><h2>This week&#39;s read</h2><span class="meta">your mentor</span></div><div class="card mread">'+out.map(function(l){return '<div class="mline">'+l+'</div>';}).join("")+'</div></div>';
}
function scorecard(){
  var d7=lastDates(7),dp=lastDates(14).slice(0,7);
  var chips="";
  activeHabits().forEach(function(h){
    if(h.type!=="number")return;
    var cu=d7.map(function(dt){return metricDayVal(h,dt);}).filter(function(x){return x!=null;});
    var pr=dp.map(function(dt){return metricDayVal(h,dt);}).filter(function(x){return x!=null;});
    if(cu.length<2)return;
    var a1=cu.reduce(function(a,b){return a+b;},0)/cu.length;
    var a2=pr.length>=2?pr.reduce(function(a,b){return a+b;},0)/pr.length:null;
    var dir="\u2192",cls="flat";
    if(a2!=null&&Math.abs(a2)>0.0001){
      var rel=(a1-a2)/Math.abs(a2);
      if(rel>0.04){dir="\u2191";cls=h.goal==="at_least"?"up":h.goal==="at_most"?"down":"flat";}
      else if(rel<-0.04){dir="\u2193";cls=h.goal==="at_least"?"down":h.goal==="at_most"?"up":"flat";}
    }
    chips+='<button class="scchip '+cls+'" data-scroll="'+h.id+'">'+(h.ic||"")+' '+esc(h.name)+'<b>'+dir+'</b></button>';
  });
  if(!chips)return "";
  return '<div class="sccards">'+chips+'</div>';
}
