function autoPopulateGoals(){
  var y=trendMonth.getFullYear(),m=trendMonth.getMonth();
  var prevM=m-1,prevY=y;if(prevM<0){prevM=11;prevY--;}
  var prevYm=prevY+"-"+String(prevM+1).padStart(2,"0");
  var curYm=y+"-"+String(m+1).padStart(2,"0");
  var prevGoals=DB.goals[prevYm]||{};
  var prevDates=monthDates(prevY,prevM);
  var daysInMonth=new Date(y,m+1,0).getDate();
  if(!DB.goals[curYm])DB.goals[curYm]={};
  activeHabits().forEach(function(h){
    if(DB.goals[curYm][h.id]!=null)return; // already set, skip
    var pg=prevGoals[h.id];
    if(pg!=null){
      // has prev goal, +5%
      var ng=Math.round(pg*1.05*10)/10;
      // cap day-count goals at days in month
      if(h.type!=="number"||(h.type==="number"&&h.goal!=="track"&&h.control!=="prefill")){
        if(ng>daysInMonth)ng=daysInMonth;
      }
      DB.goals[curYm][h.id]=ng;
    } else {
      // no prev goal, compute from prev month data
      var st=monthStats(h,prevDates);
      if(h.type==="number"&&(h.goal==="track"||h.control==="prefill")){
        // weight-like: use last value (don't auto-assume direction)
        return;
      } else if(h.type==="number"){
        // daily target habit: goal = days hit last month +5%, capped
        if(st.daysHit>0){var ng2=Math.min(daysInMonth,Math.ceil(st.daysHit*1.05));DB.goals[curYm][h.id]=ng2;}
      } else {
        // checkbox/multi: days done +5%
        if(st.daysDone>0){var ng3=Math.min(daysInMonth,Math.ceil(st.daysDone*1.05));DB.goals[curYm][h.id]=ng3;}
      }
    }
  });
  save();renderTrends();toast("Goals auto-filled (+5% from prev month)");
}

function shrinkImage(dataUrl){
  return new Promise(function(res){
    var img=new Image();
    img.onload=function(){
      var MAX=1024,w=img.width,h=img.height;
      if(w<=MAX&&h<=MAX){res(dataUrl.split(",")[1]);return;}
      var s=MAX/Math.max(w,h);
      var cv=document.createElement("canvas");cv.width=Math.round(w*s);cv.height=Math.round(h*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL("image/jpeg",0.8).split(",")[1]);
    };
    img.onerror=function(){res(dataUrl.split(",")[1]);};
    img.src=dataUrl;
  });
}
async function callGemini(apiKey,base64,context){
  var prompt="Analyze this image. It could be a photo of food/meal OR a screenshot of a nutrition label/menu. "+
    (context?"The user also typed: \""+context+"\". Use this as context (restaurant name, item name, etc). ":"")+
    "\n\nRules for estimation:\n"+
    "- CALORIES: if a range, use the HIGHER number. Always round up. Be generous with calorie estimates.\n"+
    "- PROTEIN: if a range, use the LOWER number. Always round down. Be conservative with protein.\n"+
    "- ADDED SUGAR (not total sugar specifically): If the label shows \"Added Sugars\" explicitly, use that exact value. If only \"Sugars\" or \"Total Sugars\" is shown and the food is from a restaurant or is processed/packaged, use 85-90% of that as added sugar. If it is clearly a whole food (fruit, vegetable, plain meat), use 10-20%.\n"+
    "- If this is a nutrition label screenshot, read the exact values from the label and apply the rules above.\n"+"- IMPORTANT: If the label or menu screen mentions any sauces, dressings, toppings, sides, or add-ons listed separately with their own calories (e.g. \"Gochujang Sauce 80 Cal\"), log each as its own separate item. Estimate protein and sugar for each add-on too.\n"+
    "- If this is a food photo, estimate based on typical portion sizes visible. Err on the side of more calories and less protein.\n"+
    "- Identify each distinct food item separately.\n\n"+
    "- SERVING WEIGHT: If a nutrition label shows a serving size in grams (e.g. \"Serving size 30g\") AND the package shows total weight or servings per container, estimate how many servings the full item represents. Include \"grams\" (serving size in g) and \"servings\" (count) when determinable from a label. Omit them for plain food photos where weight is not visible.\n"+
    "Respond ONLY with valid JSON, no markdown, no backticks, in this exact format: "+
    '{"items":[{"name":"item name","cal":number,"protein":number,"sugar":number,"grams":number,"servings":number}]}';
  var body={
    contents:[{parts:[
      {text:prompt},
      {inline_data:{mime_type:"image/jpeg",data:base64}}
    ]}],
    generationConfig:genCfg(getGeminiModel())
  };
  var gurl="https://generativelanguage.googleapis.com/v1beta/models/"+getGeminiModel()+":generateContent?key="+apiKey;
  var _gCtrl=new AbortController();var _gTimer=setTimeout(function(){_gCtrl.abort();},20000);
  var resp=await fetch(gurl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:_gCtrl.signal}).catch(function(e){clearTimeout(_gTimer);throw new Error("AI timed out or offline");});
  clearTimeout(_gTimer);
  if(!resp.ok&&resp.status===400&&body.generationConfig.thinkingConfig){
    delete body.generationConfig.thinkingConfig;
    resp=await fetch(gurl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  }
  if(!resp.ok){
    var t=await resp.text();
    var msg="Gemini error "+resp.status;
    try{var ej=JSON.parse(t);if(ej.error&&ej.error.message)msg=ej.error.message;}catch(e){}
    if(resp.status===429)msg="Quota exceeded for this model. Go to Settings → AI food scan → switch to Gemini 2.5 Flash.";
    if(resp.status===400)msg="Invalid Gemini API key. Check Settings > AI food scan.";
    if(resp.status===403)msg="Gemini API key not authorised. Check aistudio.google.com.";
    throw new Error(msg);
  }
  var data=await resp.json();
  var text=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]&&data.candidates[0].content.parts[0].text)||"";
  text=text.replace(/```json\n?/g,"").replace(/```\n?/g,"").trim();
  try{return JSON.parse(text);}
  catch(e){throw new Error("Could not parse Gemini response");}
}

          '<input type="number" inputmode="numeric" value="'+d.sugar+'" data-srsug="'+i+'" style="width:44px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;font-family:monospace;" placeholder="s"/>'+
          '<input type="number" inputmode="decimal" step="0.5" value="'+d.qty+'" data-srqty="'+i+'" style="width:46px;font-size:12px;border:1px solid var(--accent-soft);border-radius:6px;padding:3px 5px;font-family:monospace;background:var(--accent-soft);" placeholder="\u00D7"/>'+
          '</div>'+(d.grams?'<div style="font-size:10.5px;color:var(--ink-faint);margin-top:3px;font-family:monospace;">'+d.grams+'g/serving \u00B7 macros are per serving \u00D7 qty</div>':'')+'</div>'+
        '<button class="edit" data-srdel="'+i+'" style="color:var(--over);">\u00D7</button></div>';
    }).join("");
    SHEET.innerHTML='<div class="grab"></div><h3>Review scan</h3><p style="font-size:12px;color:var(--ink-faint);margin:0 0 12px">Edit names or macros before logging</p>'+
      '<div id="srrows">'+rows+'</div>'+
      '<button class="btn ghost" id="srAdd" style="margin-top:10px;font-size:12px;">+ Add another item</button>'+
      '<div class="btnrow" style="margin-top:12px;"><button class="btn primary" id="srConfirm">Log all</button><button class="btn ghost" id="srCancel">Cancel</button></div>';
    openSheet();
    // bind inputs
    document.querySelectorAll("[data-srname]").forEach(function(el){el.addEventListener("change",function(){draft[+el.getAttribute("data-srname")].name=el.value;});});
    document.querySelectorAll("[data-srcal]").forEach(function(el){el.addEventListener("change",function(){draft[+el.getAttribute("data-srcal")].cal=parseFloat(el.value)||0;});});
    document.querySelectorAll("[data-srpro]").forEach(function(el){el.addEventListener("change",function(){draft[+el.getAttribute("data-srpro")].protein=parseFloat(el.value)||0;});});
    document.querySelectorAll("[data-srsug]").forEach(function(el){el.addEventListener("change",function(){draft[+el.getAttribute("data-srsug")].sugar=parseFloat(el.value)||0;});});
    document.querySelectorAll("[data-srqty]").forEach(function(el){el.addEventListener("change",function(){var q=parseFloat(el.value);draft[+el.getAttribute("data-srqty")].qty=(isNaN(q)||q<=0)?1:q;});});
    document.querySelectorAll("[data-srdel]").forEach(function(el){el.addEventListener("click",function(){draft.splice(+el.getAttribute("data-srdel"),1);buildReview();});});
    document.getElementById("srAdd").addEventListener("click",function(){draft.push({name:"",cal:0,protein:0,sugar:0,qty:1});buildReview();});
    document.getElementById("srCancel").addEventListener("click",closeSheet);
    document.getElementById("srConfirm").addEventListener("click",function(){
      draft.forEach(function(d){
        if(!d.name.trim())return;
        entry(cur).foods.push({name:d.name,cal:d.cal,protein:d.protein,sugar:d.sugar,qty:d.qty||1,t:Date.now()});
        if(!DB.foods.some(function(f){return f.name.toLowerCase()===d.name.toLowerCase();}))
          DB.foods.push({name:d.name,cal:d.cal,protein:d.protein,sugar:d.sugar});
      });
      autoTickProduce(draft.map(function(d){return d.name;}));
      save();closeSheet();renderToday();toast(draft.length+" item"+(draft.length>1?"s":"")+" logged");
    });
  }
  buildReview();
}

/* ------------ auto-tick produce ------------ */
var KNOWN_PRODUCE={
  fruits:["apple","banana","orange","mango","pineapple","grape","strawberry","blueberry","watermelon","melon","peach","pear","plum","cherry","lemon","lime","grapefruit","kiwi","avocado","dragonfruit","papaya","guava","fig","coconut","lychee","pomegranate","mandarin","clementine","tangerine","apricot","berry","berries","raspberry","blackberry","cranberry","passion fruit","jackfruit","persimmon","star fruit","guava","nectarine"],
  veggies:["broccoli","spinach","kale","lettuce","cabbage","carrot","potato","tomato","cucumber","zucchini","squash","pepper","bell pepper","onion","garlic","ginger","celery","asparagus","green bean","string bean","pea","corn","eggplant","cauliflower","beet","radish","turnip","arugula","mushroom","artichoke","leek","bok choy","swiss chard","collard","brussels sprout","sweet potato","drumstick","spring onion","okra","bitter gourd"],
  seeds:["almond","cashew","walnut","peanut","pecan","pistachio","hazelnut","macadamia","pine nut","sunflower seed","pumpkin seed","chia seed","chia","flax","hemp seed","hemp","sesame","poppy seed","quinoa","raisin","prune","dried fruit","groundflax","groundnut"]
};

// drinks, processed items and cocktails that contain fruit/veg words but aren't whole foods
var PRODUCE_BLOCKLIST=["juice","juiced","drink","cocktail","martini","mojito","sangria","smoothie","shake","blend","blended","latte","tea","coffee","wine","beer","cider","punch","soda","pop","squash","cordial","extract","syrup","jam","jelly","preserve","sauce","dressing","vinegar","sorbet","sherbet","ice cream","gelato","candy","cake","pie","tart","pudding","mousse","compote","coulis","flavored","flavour","infused","popsicle","liqueur","schnapps","brandy","rum","vodka","gin","whisky","whiskey","tequila","beer","lager","ale","stout","cider","mead"];

function autoTickProduce(foodNames){
  var hs=DB.habits.filter(function(h){return h.active&&h.type==="multi"&&(h.id==="fruits"||h.id==="veggies"||h.id==="seeds");});
  hs.forEach(function(h){
    var cat=h.id==="seeds"?"seeds":h.id;
    var known=KNOWN_PRODUCE[cat]||[];
    var cur2=entry(cur).values[h.id]||[];

    foodNames.forEach(function(foodName){
      var nl=foodName.toLowerCase().trim();
      if(!nl)return;

      // Skip if blocked keyword present (juices, cocktails, processed items)
      var blocked=PRODUCE_BLOCKLIST.some(function(b){return nl.indexOf(b)>=0;});
      if(blocked)return;

      // Helper: whole-word match - the produce word must appear as its own word
      function wholeWord(text,word){
        var re=new RegExp("(^|\\s|,)"+word.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(s|es)?(\\s|,|$)","i");
        return re.test(text);
      }

      // Check existing options first (whole-word match against food name)
      var existingMatch=h.options.find(function(opt){
        var o=opt.toLowerCase();
        // exact or whole-word match; food name IS the produce
        return nl===o||wholeWord(nl,o);
      });

      if(existingMatch){
        if(cur2.indexOf(existingMatch)<0)cur2.push(existingMatch);
        return;
      }

      // Not in options yet - check known produce list with whole-word match
      var matchedKnown=known.find(function(k){return nl===k||wholeWord(nl,k);});
      if(matchedKnown){
        var label=foodName.charAt(0).toUpperCase()+foodName.slice(1);
        if(h.options.indexOf(label)<0){
          h.options.sort(function(a,b){return a.toLowerCase().localeCompare(b.toLowerCase());});
          var insertAt=h.options.findIndex(function(o){return o.toLowerCase()>label.toLowerCase();});
          if(insertAt<0)h.options.push(label);else h.options.splice(insertAt,0,label);
        }
        if(cur2.indexOf(label)<0)cur2.push(label);
      }
    });

    entry(cur).values[h.id]=cur2;
  });
}

/* ------------ text AI search (no image) ------------ */
async function askAIText(text){
  var key=getGeminiKey();if(!key){toast("Set Gemini key in Settings first");return;}
  var btn=document.getElementById("aiTextBtn");if(btn){btn.innerHTML='<span style="display:inline-block;animation:spin .7s linear infinite">⟳</span>';btn.disabled=true;}
  try{
    var prompt="The user typed: \""+text+"\". This could be a food name with quantity (like \"pineapple 250g\" or \"2 eggs\"), a meal description, or a restaurant item name. "+
      "Estimate the nutritional values. Rules: CALORIES = higher end of range. PROTEIN = lower end. ADDED SUGAR = midpoint. "+
      "Return ONLY valid JSON: {\"items\":[{\"name\":\"food name\",\"cal\":number,\"protein\":number,\"sugar\":number}]}";
    var FALLBACK_MODELS2=["gemini-3.1-flash-lite","gemini-3.5-flash","gemini-2.5-flash","gemini-3-flash-preview"];
    var startModel2=getGeminiModel();
    var tryModels=[startModel2].concat(FALLBACK_MODELS2.filter(function(m){return m!==startModel2;}));
    var resp=null;
    for(var mi2=0;mi2<tryModels.length;mi2++){
      var tm=tryModels[mi2];
      var turl="https://generativelanguage.googleapis.com/v1beta/models/"+tm+":generateContent?key="+key;
      var tbody={contents:[{parts:[{text:prompt}]}],generationConfig:genCfg(tm)};
      var r2=await fetch(turl,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(tbody)
      });
      if(!r2.ok&&r2.status===400&&tbody.generationConfig.thinkingConfig){
        delete tbody.generationConfig.thinkingConfig;
        r2=await fetch(turl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(tbody)});
      }
      if(r2.ok){resp=r2;break;} // use this model for request only, keep user preference
      if(r2.status===429||r2.status===503)continue;
      var te=await r2.text();var msg2="";try{msg2=JSON.parse(te).error.message;}catch(e){msg2=te.slice(0,80);}throw new Error(msg2);
    }
    if(!resp){throw new Error("All models hit quota. Try again in a minute.");}
    var data=await resp.json();
    var txt=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0].text)||"";
    txt=txt.replace(/```json\n?/g,"").replace(/```\n?/g,"").trim();
    var result=JSON.parse(txt);
    if(result&&result.items&&result.items.length){showSnapReview(result.items);}
    else toast("Could not estimate macros for that");
  }catch(e){var em2=e.message||"AI error";if(em2.length>80||em2.indexOf("http")>=0)em2="AI quota exceeded. Try again in a minute.";toast(em2);}
  if(btn){btn.innerHTML="✨";btn.disabled=false;}
}

/* ---------------- silent daily backup (keeps last 7 days) ---------------- */
var BK_PREFIX="tally.backup.";
function autoBackup(){
  var today=ymd(new Date());
  try{
    if(localStorage.getItem("tally.lastBackup")===today)return;
    localStorage.setItem(BK_PREFIX+today,JSON.stringify(DB));
    localStorage.setItem("tally.lastBackup",today);
    var ks=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(BK_PREFIX)===0)ks.push(k);}
    ks.sort().reverse().slice(7).forEach(function(k){localStorage.removeItem(k);});
  }catch(e){}
}
function getBackupDates(){
  var out=[];
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(BK_PREFIX)===0)out.push(k.slice(BK_PREFIX.length));}}catch(e){}
  return out.sort().reverse();
}
function restoreBackup(d){
  try{
    var raw=localStorage.getItem(BK_PREFIX+d);
    if(!raw){toast("Backup not found");return;}
    DB=JSON.parse(raw);save();render();toast("Restored "+d);
  }catch(e){toast("Restore failed");}
}
function openRestoreSheet(){
  var ds=getBackupDates();
  if(!ds.length){toast("No auto-backups yet. One saves on first open each day.");return;}
  SHEET.innerHTML='<div class="grab"></div><h3>Restore a day</h3>'+
    '<div class="note" style="margin:0 0 14px;">Tally snapshots your data once a day and keeps the last 7. Restoring replaces what you have now.</div>'+
    ds.map(function(d){return '<button class="btn ghost" data-restore="'+d+'" style="margin-bottom:8px;">'+d+'</button>';}).join("");
  openSheet();
  Array.prototype.forEach.call(SHEET.querySelectorAll("[data-restore]"),function(b){
    b.addEventListener("click",function(){
      var d=b.getAttribute("data-restore");
      if(confirm("Restore "+d+"? This replaces your current data.")){restoreBackup(d);closeSheet();}
    });
  });
}

/* ---------------- monthly goal nudge ---------------- */
function checkMonthlySuggestion(){
  var today=new Date();
  if(today.getDate()!==1)return; // only on 1st of month
  var lastCheck=localStorage.getItem('tally.monthlyCheck');
  var thisMonth=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
  if(lastCheck===thisMonth)return;
  localStorage.setItem('tally.monthlyCheck',thisMonth);

  // Calculate last month's avg sugar
  var lastMonth=new Date(today.getFullYear(),today.getMonth()-1,1);
  var days=[];
  for(var d=new Date(lastMonth);d.getMonth()===lastMonth.getMonth();d.setDate(d.getDate()+1)){
    days.push(ymd(new Date(d)));
  }
  var sugarH=DB.habits.find(function(h){return h.id==='sugar'&&h.active;});
  if(!sugarH||!sugarH.target)return;
  var sugarVals=days.map(function(dt){var ft=foodTotals(dt);return ft.sugar||0;}).filter(function(v){return v>0;});
  if(sugarVals.length<10)return; // not enough data
  var avgSugar=sugarVals.reduce(function(a,b){return a+b;},0)/sugarVals.length;
  var SUGAR_FLOOR=8;
  var suggested=Math.max(SUGAR_FLOOR,Math.round((sugarH.target*0.95)*10)/10);
  if(suggested>=sugarH.target)return; // no improvement to suggest
  setTimeout(function(){
    toast('Monthly tip: Avg sugar was '+Math.round(avgSugar)+'g. Reduce goal to '+suggested+'g? Go to Settings → edit Sugar habit.');
  },3000);
}

/* ---------------- swipe between days ---------------- */
(function(){
  var vEl=document.getElementById("view");
  var sx=0,sy=0,swipeOk=false;
  vEl.addEventListener("touchstart",function(e){
    if(tab!=="today"){swipeOk=false;return;}
    if(e.target.closest("input,button,.chips,.recents,.suggest,.stepper,.sld,.vessels,.banner")){swipeOk=false;return;}
    swipeOk=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;
  },{passive:true});
  vEl.addEventListener("touchend",function(e){
    if(!swipeOk)return;swipeOk=false;
    var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<64||Math.abs(dx)<Math.abs(dy)*2)return;
    var d=parseYMD(cur);d.setDate(d.getDate()+(dx<0?1:-1));cur=ymd(d);
    render();
    vEl.classList.remove("pageL","pageR");void vEl.offsetWidth;
    vEl.classList.add(dx<0?"pageL":"pageR");
    setTimeout(function(){vEl.classList.remove("pageL","pageR");},300);
  },{passive:true});
})();

(async function boot(){
  if(!DB.settings.setup){DB.settings.setup=true;save(true);}
  render();setTimeout(autoBackup,2000);checkMonthlySuggestion();
})();
